<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Chiikawa Desktop Club browser companion and app downloads.">
  <title>Chiikawa Desktop Club</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202a28;
      background: #f5f8f2;
    }
    * { box-sizing: border-box; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      background: radial-gradient(circle at 80% 0%, #dcefe4, transparent 32rem), #f5f8f2;
    }
    main {
      width: min(760px, 100%);
      padding: clamp(30px, 7vw, 70px);
      border: 1px solid #d7e4dc;
      border-radius: 30px;
      background: rgb(255 255 255 / 84%);
      box-shadow: 0 24px 70px rgb(32 42 40 / 10%);
      text-align: center;
    }
    .logo {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      margin: 0 auto 22px;
      border-radius: 18px;
      color: #fff;
      background: #187e69;
      font-size: 29px;
    }
    h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 5.5rem); line-height: .95; letter-spacing: -.07em; }
    p { max-width: 560px; margin: 22px auto 32px; color: #68766f; font-size: 1.1rem; line-height: 1.65; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 19px;
      border-radius: 13px;
      color: #fff;
      background: #187e69;
      font-weight: 800;
      text-decoration: none;
    }
    a:hover { background: #0e5c4d; }
    a.secondary { color: #0e5c4d; background: #e1f2e7; }
    a.secondary:hover { background: #cde8d7; }
    footer { margin-top: 34px; color: #849089; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">✿</div>
    <h1>Chiikawa Desktop Club</h1>
    <p>A tiny desktop companion that reacts to your music, audio, and mood. Open it in your browser or download the native app for your computer.</p>
    <div class="actions">
      <a href="browser-app.html">Open browser app</a>
      <a class="secondary" href="downloads.html">Download the app</a>
    </div>
    <footer>Choose a character, set a mood, and let your companion join the fun.</footer>
  </main>
</body>
</html>
